<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classification Lookup Viewer</title>
    <link rel="stylesheet" href="./styles.css?v=20260416r1" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div class="hero-topbar">
          <a
            class="hero-link"
            href="https://www.jpo.go.jp/cgi/cgi-bin/search-portal/narabe_tool/narabe.cgi"
            target="_blank"
            rel="noopener noreferrer"
            >分類対照ツール</a
          >
        </div>
        <p class="eyebrow">Classification Hierarchy Viewer</p>
        <h1>分類コードをまとめて確認する</h1>
        <p class="lead">
          複数の IPC / FI / CPC コードを入力すると、コードごとの分類種別、階層情報、定義を一覧表示します。
        </p>
      </section>

      <section class="panel">
        <form id="lookup-form" class="lookup-form">
          <div class="field field-full">
            <span>表示モード</span>
            <div class="choice-list" role="radiogroup" aria-label="表示モード">
              <label class="choice-chip">
                <input type="radio" name="lookup-mode" value="lookup" checked />
                <span>コード情報</span>
              </label>
              <label class="choice-chip">
                <input type="radio" name="lookup-mode" value="children" />
                <span>1つ下の階層</span>
              </label>
            </div>
          </div>

          <div id="children-target-field" class="field field-full">
            <span id="target-mode-label">参照する分類</span>
            <div id="children-target-group" class="choice-list" role="radiogroup" aria-label="参照する分類">
              <label class="choice-chip">
                <input type="radio" name="children-target" value="ipc" checked />
                <span>IPC</span>
              </label>
              <label class="choice-chip">
                <input type="radio" name="children-target" value="fi" />
                <span>FI</span>
              </label>
              <label class="choice-chip">
                <input type="radio" name="children-target" value="cpc" />
                <span>CPC</span>
              </label>
            </div>
          </div>

          <label class="field">
            <span>IPC / FI / CPC コード</span>
            <textarea
              id="ipc-input"
              name="ipc"
              rows="5"
              placeholder="例:
H04N1/029
H04N1/00C
H04N1/00061

横並び入力にも対応しています。"
              autocomplete="off"
            ></textarea>
          </label>
          <button type="submit">表示する</button>
        </form>

        <div class="quick-list">
          <span>サンプル</span>
          <button type="button" data-code="H04N1/029">H04N1/029</button>
          <button type="button" data-code="H04N1/00C">H04N1/00C</button>
          <button type="button" data-code="H04N1/00061">H04N1/00061</button>
        </div>

        <p id="status" class="status">分類コードを入力すると、ここに処理状況を表示します。</p>
      </section>

      <section class="panel">
        <div class="result-header">
          <h2>検索結果</h2>
          <p id="result-meta" class="result-meta"></p>
        </div>
        <div id="result-list" class="result-list"></div>
      </section>
    </main>

    <template id="result-item-template">
      <article class="result-item">
        <div class="result-topline">
          <span class="code-wrap">
            <code class="code"></code>
          </span>
        </div>
        <div class="result-tags">
          <span class="tag type"></span>
          <span class="tag hierarchy"></span>
        </div>
        <div class="definitions">
          <section class="definition-pane definition-pane-ja">
            <p class="definition-title">定義</p>
            <p class="definition ja"></p>
          </section>
          <section class="definition-pane definition-pane-en">
            <p class="definition-title">英語</p>
            <p class="definition en"></p>
          </section>
        </div>
        <section class="theme-block" hidden>
          <p class="theme-title">対応テーマコード</p>
          <div class="theme-list"></div>
        </section>
      </article>
    </template>

    <script src="./classification-common.js?v=20260416r1"></script>
    <script src="./theme-utils.js?v=20260416r1"></script>
    <script src="./app.js?v=20260416r1"></script>
  </body>
</html>
